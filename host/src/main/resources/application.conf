ktor.application.modules = ["cloud.mallne.dicentra.synapse.ApplicationKt.module"]
ktor.deployment.port = 8080
ktor.deployment.port = ${?PORT}
ktor.development = false
ktor.development = ${?DEVELOPMENT}

server.hostname = ""
server.hostname = ${?HOSTNAME}
server.cors.all = false
server.cors.all = ${?CORS_ALL}
server.cors.hosts = ""
server.cors.hosts = ${?CORS_HOSTS}

data.url = ${DATA_URL}
data.user = ${DATA_USER}
data.password = ${DATA_PASSWORD}
data.schema = "synapse"
data.schema = ${?DATA_SCHEMA}

catalyst.enabled = true
catalyst.enabled = ${?CATALYST_ENABLED}
catalyst.anonymous = true
catalyst.anonymous = ${?CATALYST_ANONYMOUS}
catalyst.max_targets = 32
catalyst.max_targets = ${?CATALYST_MAX_TARGETS}
catalyst.max_concurrent_targets = 4
catalyst.max_concurrent_targets = ${?CATALYST_MAX_CONCURRENT_TARGETS}
catalyst.max_request_bytes = 1048576
catalyst.max_request_bytes = ${?CATALYST_MAX_REQUEST_BYTES}
catalyst.max_response_bytes = 16777216
catalyst.max_response_bytes = ${?CATALYST_MAX_RESPONSE_BYTES}
catalyst.max_aggregate_response_bytes = 33554432
catalyst.max_aggregate_response_bytes = ${?CATALYST_MAX_AGGREGATE_RESPONSE_BYTES}
catalyst.per_target_timeout_millis = 15000
catalyst.per_target_timeout_millis = ${?CATALYST_PER_TARGET_TIMEOUT_MILLIS}
catalyst.overall_timeout_millis = 30000
catalyst.overall_timeout_millis = ${?CATALYST_OVERALL_TIMEOUT_MILLIS}
catalyst.allowed_hosts = ""
catalyst.allowed_hosts = ${?CATALYST_ALLOWED_HOSTS}
# Public services may only be published by superadmins; exact hosts can be trusted optionally.
catalyst.allow_public_service_hosts = false
catalyst.allow_public_service_hosts = ${?CATALYST_ALLOW_PUBLIC_SERVICE_HOSTS}
catalyst.server_name = ""
catalyst.server_name = ${?CATALYST_SERVERNAME}
catalyst.tls_enabled = true
catalyst.tls_enabled = ${?CATALYST_TLSENABLED}
catalyst.title = "Synapse Catalyst"
catalyst.title = ${?CATALYST_TITLE}
catalyst.description = "Make Requests to a stored Service in a single Tenant setup."
catalyst.description = ${?CATALYST_DESCRIPTION}

preferred_transform = "Native"
preferred_transform = ${?PREFERRED_TRANSFORM}

telemetry.endpoint = ""
telemetry.endpoint = ${?OTEL_EXPORTER_OTLP_ENDPOINT}
telemetry.service_name = "synapse"
telemetry.service_name = ${?OTEL_SERVICE_NAME}

security.enabled = false
security.enabled = ${?SECURITY_ENABLED}
security.issuer = ""
security.issuer = ${?SECURITY_ISSUER}
security.scopes = ""
security.scopes = ${?SECURITY_SCOPES}
security.client_id = ""
security.client_id = ${?SECURITY_CLIENTID}
security.client_secret = ""
security.client_secret = ${?SECURITY_CLIENTSECRET}
security.app.issuer = ""
security.app.issuer = ${?SECURITY_ISSUER}
security.app.scopes = ""
security.app.scopes = ${?SECURITY_APP_SCOPES}
security.app.client_id = ""
security.app.client_id = ${?SECURITY_APP_CLIENTID}
security.groups.user = ""
security.groups.user = ${?SECURITY_GROUPS_USER}
security.groups.admin = ""
security.groups.admin = ${?SECURITY_GROUPS_ADMIN}
security.groups.superadmin = ""
security.groups.superadmin = ${?SECURITY_GROUPS_SUPERADMIN}
